<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EtsyAuto Optimizer</title>
  <link rel="stylesheet" href="side-panel.css" />
</head>
<body>
  <header class="header">
    <img src="../icons/icon-32.png" alt="EtsyAuto" class="logo" />
    <h1 class="title">EtsyAuto</h1>
    <span id="status-dot" class="status-dot status-unknown" title="Backend status"></span>
  </header>

  <main class="main">
    <!-- No listing detected -->
    <div id="view-empty" class="view">
      <p class="hint">Navigate to an Etsy listing page to get started.</p>
    </div>

    <!-- Admin mode: listing edit page -->
    <div id="view-listing" class="view hidden">
      <div class="listing-card">
        <div id="image-preview" class="image-preview"></div>
        <p id="listing-id" class="listing-id"></p>
        <p id="listing-title" class="listing-title"></p>
      </div>

      <div id="action-area" class="action-area">
        <button id="btn-send" class="btn btn-primary">Save as Idea</button>
        <p id="action-msg" class="action-msg hidden"></p>
      </div>
    </div>

    <!-- Creator mode: shop /listings/new page -->
    <div id="view-creator" class="view hidden">
      <div class="creator-section">
        <p class="ref-label">Shop ID</p>
        <input id="creator-shop-id" class="config-input" type="text" placeholder="e.g. 12345678" />
      </div>

      <div class="creator-section">
        <p class="ref-label">Template</p>
        <select id="creator-template" class="config-input"></select>
      </div>

      <div class="creator-section">
        <p class="ref-label">Design</p>
        <select id="creator-design" class="config-input"></select>
      </div>

      <div class="creator-section">
        <button id="creator-btn-preview" class="btn btn-ghost btn-sm">Preview All Colors</button>
        <div id="creator-color-grid" class="color-grid"></div>
      </div>

      <div class="creator-section">
        <p class="ref-label">Variations Matrix <span class="ref-hint">(uncheck to skip)</span></p>
        <div id="creator-matrix-wrap" class="variations-matrix-wrap"></div>
      </div>

      <div class="creator-section">
        <label for="creator-title" class="ref-label">Title <span class="ref-hint">(≤140 chars)</span></label>
        <textarea id="creator-title" class="ref-textarea" rows="2" maxlength="140"
                  placeholder="Listing title..."></textarea>
      </div>

      <div class="creator-section">
        <label for="creator-description" class="ref-label">Description</label>
        <textarea id="creator-description" class="ref-textarea" rows="4"
                  placeholder="Listing description..."></textarea>
      </div>

      <div class="creator-section">
        <label for="creator-tags" class="ref-label">Tags <span class="ref-hint">(comma-separated, max 13)</span></label>
        <input id="creator-tags" class="config-input" type="text"
               placeholder="t-shirt, custom, gift" />
      </div>

      <div class="creator-section">
        <button id="creator-btn-create" class="btn btn-primary">Create Etsy Draft</button>
      </div>

      <div id="creator-toast" class="ref-toast hidden"></div>
    </div>

    <!-- Reference mode: public listing page -->
    <div id="view-reference" class="view hidden">
      <div class="ref-section">
        <p class="ref-label">Source</p>
        <p id="ref-source-url" class="ref-source-url"></p>
      </div>

      <div class="ref-section">
        <p class="ref-label">Original Title</p>
        <p id="ref-original-title" class="ref-original-title"></p>
      </div>

      <div class="ref-section">
        <button id="ref-btn-suggest" class="btn btn-ghost btn-sm">AI Suggest Title</button>
        <div id="ref-variants-list" class="variants-list"></div>
      </div>

      <div class="ref-section">
        <label for="ref-edited-title" class="ref-label">Edited Title</label>
        <textarea id="ref-edited-title" class="ref-textarea" rows="3"
                  placeholder="Edit or paste a title variant…"></textarea>
      </div>

      <div class="ref-section">
        <p class="ref-label">Images <span class="ref-hint">(click to select)</span></p>
        <div id="ref-image-grid" class="image-grid"></div>
      </div>

      <div class="ref-section">
        <label for="ref-notes" class="ref-label">Notes</label>
        <textarea id="ref-notes" class="ref-textarea" rows="3"
                  placeholder="Any notes about this reference…"></textarea>
      </div>

      <div class="ref-section">
        <p class="ref-label">Tags</p>
        <div id="ref-tags" class="tags-container"></div>
      </div>

      <div class="ref-section">
        <button id="ref-btn-save" class="btn btn-primary">Save Reference</button>
      </div>

      <div id="ref-toast" class="ref-toast hidden"></div>

      <div class="ref-section ref-row ref-footer">
        <span class="ref-label">Status:</span>
        <span id="ref-status-badge" class="status-badge">—</span>
      </div>
    </div>
  </main>

  <footer class="footer">
    <span id="status-label" class="status-label">Checking connection…</span>
    <button id="btn-refresh" class="btn btn-ghost btn-sm">Refresh</button>
    <button id="btn-config" class="btn btn-ghost btn-sm" title="Settings">⚙</button>
  </footer>

  <!-- Crop modal: drag rectangle to isolate design region before BG removal -->
  <div id="crop-modal" class="crop-modal hidden">
    <div class="crop-modal-inner">
      <p class="crop-hint">Drag a rectangle around the design area, then Confirm. Or Skip to use the whole image.</p>
      <div id="crop-canvas-wrap" class="crop-canvas-wrap">
        <img id="crop-image" class="crop-image" alt="crop source" />
        <div id="crop-rect" class="crop-rect hidden"></div>
      </div>
      <div class="crop-actions">
        <button id="btn-crop-skip" class="btn btn-ghost btn-sm">Skip crop</button>
        <button id="btn-crop-confirm" class="btn btn-primary btn-sm" disabled>Confirm</button>
        <button id="btn-crop-cancel" class="btn btn-ghost btn-sm">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Config panel: Backend URL + Admin Token -->
  <div id="config-panel" class="config-panel hidden">
    <label for="input-backend-url" class="config-label">Backend URL</label>
    <input id="input-backend-url" type="text" class="config-input"
           placeholder="https://etsy.leesun.space" />

    <label for="input-admin-token" class="config-label" style="margin-top:8px;">Admin Token</label>
    <input id="input-admin-token" type="password" class="config-input"
           placeholder="your-admin-token" />

    <div class="config-actions">
      <button id="btn-config-save" class="btn btn-primary btn-sm">Save</button>
      <button id="btn-config-cancel" class="btn btn-ghost btn-sm">Cancel</button>
    </div>
  </div>

  <script src="../shared/backend-client.js"></script>
  <script src="crop-modal.js"></script>
  <script src="reference-mode.js"></script>
  <script src="creator-mode.js"></script>
  <script src="side-panel.js"></script>
</body>
</html>
